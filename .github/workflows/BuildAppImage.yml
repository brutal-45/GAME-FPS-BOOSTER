name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install system dependencies required by appimage-builder
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            patchelf \
            desktop-file-utils \
            libgdk-pixbuf2.0-dev \
            squashfs-tools \
            fakeroot \
            zsync \
            wget

      # Install appimage-builder via pip
      - name: Install appimage-builder
        run: |
          sudo pip3 install appimage-builder

      # (Optional) Insert steps here to compile your app before building the AppImage

      # Build AppImage with --skip-test to prevent FUSE mounting errors inside GitHub Actions
      - name: Build AppImage
        run: |
          appimage-builder --recipe ./AppImageBuilder.yml --skip-test
