name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # AppImage creation requires elevated permissions to mount images/containers
    container:
      image: ubuntu:22.04
      options: --privileged -v /var/run/docker.sock:/var/run/docker.sock

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # (Optional) Insert steps here to compile your app if needed

      - name: Build AppImage
        uses: AppImageCrafters/build-appimage-action@v1
        with:
          recipe: "./AppImageBuilder.yml"
